services:
  - type: web
    name: crime-ranking-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        value: CrimeRankingDB
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openai/gpt-4o-mini
      - key: OLLAMA_URL
        value: http://92.4.87.178:11434
      - key: OLLAMA_MODEL
        value: qwen2.5:14b
      - key: OLLAMA_API_KEY
        value: ollama
    rootDir: backend
